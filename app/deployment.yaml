apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-chatbot
  namespace: rag-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-chatbot
  template:
    metadata:
      labels:
        app: rag-chatbot
    spec:
      containers:
        - name: rag-chatbot
          image: 127372371582.dkr.ecr.us-east-1.amazonaws.com/rag-chatbot:build-4
          ports:
            - containerPort: 8501
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-chatbot-secret
                  key: GEMINI_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
