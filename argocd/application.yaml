apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-chatbot
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/adityarana021/rag-chatbot-gitops.git
    targetRevision: main
    path: app

  destination:
    server: https://kubernetes.default.svc
    namespace: rag-chatbot

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
